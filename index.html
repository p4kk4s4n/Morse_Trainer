<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Learn Morse code by ear with the Koch method. Works offline.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Morse Trainer">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22110%22%20fill%3D%22%230b1220%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2240%22%20width%3D%22432%22%20height%3D%22432%22%20rx%3D%2280%22%20fill%3D%22%23131c2f%22%20stroke%3D%22%2326334f%22%20stroke-width%3D%228%22%2F%3E%3Crect%20x%3D%2286%22%20y%3D%22226%22%20width%3D%22130%22%20height%3D%2260%22%20rx%3D%2230%22%20fill%3D%22%2338bdf8%22%2F%3E%3Crect%20x%3D%22240%22%20y%3D%22226%22%20width%3D%22130%22%20height%3D%2260%22%20rx%3D%2230%22%20fill%3D%22%2338bdf8%22%2F%3E%3Ccircle%20cx%3D%22416%22%20cy%3D%22256%22%20r%3D%2230%22%20fill%3D%22%2338bdf8%22%2F%3E%3C%2Fsvg%3E" type="image/svg+xml">
  <title>Morse Trainer</title>
  <style>
:root {
  --bg: #0b1220;
  --panel: #131c2f;
  --panel2: #1b2742;
  --line: #26334f;
  --text: #e5ecf7;
  --muted: #8a9ab8;
  --accent: #38bdf8;
  --accent-ink: #04202e;
  --good: #4ade80;
  --warn: #fbbf24;
  --bad: #f87171;
  --radius: 14px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
h1 { margin: 0; font-size: 1.5rem; }
h2 { margin: .2em 0 .6em; }
p { margin: .4em 0; }
b { font-weight: 650; }

#app { display: flex; flex-direction: column; height: 100dvh; max-width: 560px; margin: 0 auto; }
.screen { flex: 1; overflow-y: auto; padding: 16px 16px 24px; padding-top: max(16px, env(safe-area-inset-top)); }
#nav { display: flex; background: var(--panel); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom); }
#nav button { flex: 1; background: none; border: 0; padding: 8px 4px 10px; display: flex; flex-direction: column;
  align-items: center; gap: 2px; font-size: .72rem; color: var(--muted); }
#nav button.active { color: var(--accent); }
.nav-ic { font-size: 1.3rem; }
.no-nav #nav { display: none; }

.muted { color: var(--muted); }
.small { font-size: .85rem; }
.center { text-align: center; }
.hidden { display: none !important; }
.grow { flex: 1; }
.good-text { color: var(--good); }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.top h1 + p { margin: 2px 0 0; }
.top-pills { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.badge { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 650; font-size: .92rem; }
.badge-strip { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: .85rem; flex-wrap: wrap; }
.badge-icons { display: inline-flex; align-items: center; gap: 5px; font-size: 1.15rem; }
.badge-icons span.locked { opacity: .25; filter: grayscale(1); }
.badge-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
.badge-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); text-align: left; }
.badge-item.earned { border-color: var(--accent); background: rgba(245, 185, 66, .1); }
.badge-item.locked { opacity: .45; }
.badge-ic { font-size: 1.55rem; line-height: 1; flex-shrink: 0; }
.badge-item.locked .badge-ic { filter: grayscale(1); }
.badge-info { display: flex; flex-direction: column; min-width: 0; }
.badge-info b { font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge-info small { color: var(--muted); font-size: .78rem; }
.badge-item.earned .badge-info small { color: var(--accent); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.card > b:first-child { display: block; margin-bottom: 8px; }
.row.between > b:first-child { margin-bottom: 0; }
.msg { background: var(--panel2); }
.msg.good { border-color: var(--good); }

.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; font-weight: 600; text-align: center; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.small { padding: 7px 12px; font-size: .9rem; }
.btn.big { padding: 16px; font-size: 1.1rem; }
.btn.danger { color: var(--bad); border-color: #5b2a2a; }
.install { width: 100%; margin-top: 4px; }

/* bars & rings */
.bar { height: 8px; background: var(--panel2); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.bar.good .bar-fill { background: var(--good); }
.bar.ok .bar-fill { background: var(--warn); }
.bar.bad .bar-fill { background: var(--bad); }
.ring { --p: 0; width: 140px; height: 140px; border-radius: 50%; margin: 6px auto 14px; display: grid; place-items: center;
  background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--panel2) 0); }
.ring-in { width: 112px; height: 112px; border-radius: 50%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-in b { font-size: 1.9rem; }
.ring-in small { color: var(--muted); }

/* dots & dashes */
.pattern { display: inline-flex; align-items: center; gap: 4px; }
.pattern i { display: inline-block; height: 8px; background: var(--accent); border-radius: 99px; }
.pattern .dot { width: 8px; }
.pattern .dash { width: 24px; }

/* home */
.modes { display: flex; flex-direction: column; gap: 0; }
.mode { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; }
.mode.soon { opacity: .5; }
.mode-ic { font-size: 2rem; }
.mode-tx { display: flex; flex-direction: column; flex: 1; }
.mode-tx small { color: var(--muted); }
.chev { font-size: 1.8rem; color: var(--muted); }
.big-num { font-size: 1.5rem; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; justify-content: center; }
.chip { min-width: 36px; height: 38px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); font-weight: 650; }
.chip.on { border-color: var(--accent); }
.chip.new { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.locked { opacity: .35; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.tiles.four { grid-template-columns: repeat(2, 1fr); }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; text-align: center; }
.tile b { display: block; font-size: 1.25rem; }
.tile small { color: var(--muted); }

/* week */
.week { display: flex; justify-content: space-between; margin-top: 10px; }
.wk { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); }
.wk-dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); }
.wk.part .wk-dot { background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); border-color: var(--accent); }
.wk.full .wk-dot { background: var(--good); border-color: var(--good); }
.wk.today small { color: var(--text); font-weight: 700; }
.streak { font-size: 2.6rem; font-weight: 700; }

/* weak list */
.weak { display: flex; flex-direction: column; gap: 6px; }
.weak-row { display: grid; grid-template-columns: 32px 70px 1fr 42px; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 0; text-align: left; }
.weak-ch { font-size: 1.3rem; font-weight: 700; }
.weak-pct { text-align: right; color: var(--muted); font-size: .85rem; }

/* learn */
.learn { display: flex; flex-direction: column; align-items: center; padding-top: 6vh; }
.learn-ch { font-size: 7rem; font-weight: 800; line-height: 1; color: var(--accent); }
.learn-pat { margin: 16px 0 6px; transform: scale(1.7); }
.learn-say { font-size: 1.4rem; margin: 10px 0 14px; letter-spacing: .04em; }
.learn .stack { width: 100%; }

/* chart & heatmap */
.chart { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chart-cell { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.chart-cell.locked { opacity: .4; }
.chart-ch { font-size: 1.5rem; font-weight: 700; }
.heatmap { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin: 8px 0; }
.heat { aspect-ratio: 1; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); font-weight: 700; }
.heat.locked { opacity: .35; }

/* settings */
.set { display: block; margin: 12px 0; }
.set input[type=range] { width: 100%; accent-color: var(--accent); margin-top: 6px; }

/* result */
.missed-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.missed { display: inline-flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.missed b { font-size: 1.2rem; }

/* practice */
.screen-practice { padding: 12px 14px; display: flex; flex-direction: column; }
.practice { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.p-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.p-title { font-weight: 650; }
.p-meter { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 84px; text-align: right; }
.p-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; min-height: 0; overflow-y: auto; }
.p-actions { display: flex; gap: 10px; }
.p-actions .btn { flex: 1; padding: 14px; }
.ready { text-align: center; }
.big-icon { font-size: 3.2rem; }
.listen { display: flex; justify-content: center; align-items: center; gap: 6px; height: 56px; }
.listen i { width: 8px; height: 10px; border-radius: 4px; background: var(--panel2); transition: background .2s; }
.listen.playing i { background: var(--accent); animation: eq .7s ease-in-out infinite alternate; animation-delay: calc(var(--i) * 90ms); }
@keyframes eq { from { height: 8px; } to { height: 52px; } }
.slots { display: flex; justify-content: center; gap: 8px; }
.slot { width: 52px; height: 64px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel);
  display: grid; place-items: center; font-size: 1.9rem; font-weight: 700; }
.slot.active { border-color: var(--accent); }
.slot.filled { border-color: var(--text); }
.kb { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; padding-bottom: env(safe-area-inset-bottom); }
.key { height: 44px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); font-weight: 650; font-size: 1.05rem; padding: 0; position: relative; }
.key:active { background: var(--accent); color: var(--accent-ink); }
.key.newest { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.key.wide { grid-column: span 2; }
@media (max-width: 380px) { .kb { grid-template-columns: repeat(7, 1fr); } .slot { width: 46px; } }

/* mobile input pad modes (#1-#4) */
.kb-wrap { padding-bottom: env(safe-area-inset-bottom); }
.kb-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.kb-cards .key { height: 62px; font-size: 1.55rem; font-weight: 750; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.kb-cards .key.odd-last { grid-column: span 2; }
.kb-cards .key.back { grid-column: span 2; height: 44px; font-size: 1rem; color: var(--muted); }
.kb-keys.compact { grid-template-columns: repeat(6, 1fr); }
.kb-keys.compact .key { height: 48px; font-size: 1.15rem; }
.kb-ditdah, .kb-tree { display: flex; flex-direction: column; gap: 8px; }
.dd-bar { min-height: 40px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dd-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dd-btn { height: 68px; border-radius: 14px; background: var(--panel2); border: 2px solid var(--accent);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 750; }
.dd-btn b { font-size: 1.7rem; line-height: 1; color: var(--accent); }
.dd-btn small { color: var(--muted); font-size: .8rem; }
.dd-btn:active { background: var(--accent); color: var(--accent-ink); }
.dd-btn:active b, .dd-btn:active small { color: var(--accent-ink); }
.dd-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dd-actions .key { height: 42px; }
.key.pick-ready { border-color: var(--good); color: var(--good); }
.tree-view { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; gap: 8px; }
.tree-branch { font-size: .9rem; color: var(--muted); display: flex; flex-direction: column; align-items: center; }
.tree-branch b { font-size: 1.2rem; color: var(--text); }
.tree-branch.dim { opacity: .35; }
.tree-cur { display: flex; flex-direction: column; align-items: center; min-width: 72px; }
.tree-cur b { font-size: 2rem; line-height: 1.05; color: var(--accent); }
.tree-btns { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 8px; }
.tree-btns .key { height: 54px; font-size: 1.05rem; }
.seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 6px; }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg-btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: .88rem; font-weight: 600; color: var(--muted); }
.seg-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(56, 189, 248, .1); }
.seg-btn:disabled { opacity: .45; cursor: not-allowed; }

/* Set 2: Q-Codes & Callsigns study + quiz */
.lock-banner { background: var(--panel2); border: 1px dashed var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; }
.lock-banner .lock-ic { font-size: 1.6rem; }
.qso-item { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 8px; }
.qso-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.qso-code { font-size: 1.25rem; font-weight: 800; color: var(--accent); letter-spacing: .04em; }
.qso-meaning { font-weight: 650; margin-bottom: 4px; }
.qso-ex { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .84rem; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin-top: 6px; color: var(--accent); }
.quiz-opts { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 10px; }
.quiz-opt { background: var(--panel2); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; text-align: left; font-weight: 600; }
.quiz-opt.correct { border-color: var(--good); background: rgba(52, 211, 153, .12); color: var(--good); }
.quiz-opt.wrong { border-color: var(--bad); background: rgba(248, 113, 113, .12); color: var(--bad); }

/* Stats page completed lessons and words/callsigns */
.stats-subcard { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-top: 10px; }
.stats-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; max-height: 280px; overflow-y: auto; padding-right: 4px; }
.stats-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; width: 100%; text-align: left; font-family: inherit; color: inherit; cursor: pointer; }
.stats-item:hover, .stats-item:focus { border-color: var(--accent); }
.stats-item.done { border-color: rgba(52, 211, 153, 0.45); }
.stats-item.next { border-color: var(--accent); background: rgba(56, 189, 248, 0.08); }
.stats-item.locked { opacity: 0.65; }
.stats-item-left { display: flex; align-items: center; gap: 10px; }
.stats-item-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.stats-lesson-num { font-weight: 800; color: var(--accent); font-size: .95rem; min-width: 32px; }
.stats-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; max-height: 180px; overflow-y: auto; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.word-chip { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .88rem; font-weight: 700; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; color: var(--text); cursor: pointer; }
.word-chip:hover, .word-chip:focus { border-color: var(--accent); color: var(--accent); }

.fb-score { text-align: center; font-size: 1.4rem; font-weight: 700; }
.fb-score.good { color: var(--good); }
.fb-grid { display: flex; justify-content: center; gap: 8px; }
.fb-col { width: 52px; border-radius: 12px; overflow: hidden; border: 2px solid var(--line); text-align: center; }
.fb-exp { font-size: 1.8rem; font-weight: 700; padding: 8px 0; background: var(--panel); }
.fb-got { padding: 6px 0; font-weight: 650; background: var(--panel2); }
.fb-col.ok { border-color: var(--good); }
.fb-col.ok .fb-got { color: var(--good); }
.fb-col.bad { border-color: var(--bad); }
.fb-col.bad .fb-got { color: var(--bad); }
.fb-missed { text-align: center; }
.fb-missed .missed { margin: 3px; }

/* toggle card */
.toggle { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.toggle span { display: flex; flex-direction: column; }

/* arcade */
.screen-arcade-play { padding: 10px 12px; display: flex; flex-direction: column; }
.arcade { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; position: relative; }
.a-hud { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
.a-mid { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.a-score { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.a-combo { font-size: .8rem; color: var(--warn); min-height: 1em; }
.a-right { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }
.a-lives { color: var(--bad); font-size: 1.15rem; letter-spacing: 2px; }
.a-level { color: var(--muted); font-size: .8rem; }
.field { flex: 1; position: relative; overflow: hidden; border-radius: var(--radius); border: 1px solid var(--line);
  background: radial-gradient(circle at 50% 0%, #16223d 0%, var(--bg) 70%); min-height: 220px; }
.field .danger { position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
  background: repeating-linear-gradient(90deg, var(--bad) 0 12px, transparent 12px 20px); opacity: .7; }
.field.hit { animation: hit .4s; }
@keyframes hit { 0%, 100% { box-shadow: none; } 30% { box-shadow: inset 0 -40px 40px -20px rgba(248,113,113,.6); } }
.drop { position: absolute; top: 0; min-width: 56px; height: 56px; padding: 0 10px; border-radius: 28px; border: 2px solid var(--accent);
  background: var(--panel2); font-size: 1.6rem; font-weight: 800; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 18px rgba(56,189,248,.25); will-change: transform; }
.drop.hint .pattern { gap: 3px; }
.drop.hint .pattern .dot { width: 7px; height: 7px; }
.drop.hint .pattern .dash { width: 16px; height: 7px; }
.drop.wrong { border-color: var(--bad); box-shadow: 0 0 18px rgba(248,113,113,.35); }
.drop.wrong .pattern i { background: var(--bad); }
.drop.pop { background: var(--good); color: #052e14; border-color: var(--good); animation: pop .45s forwards; }
.drop.land { background: var(--bad); color: #3b0a0a; border-color: var(--bad); animation: fade .45s forwards; }
.drop.shake { animation: shake .35s; }
@keyframes pop { to { opacity: 0; scale: 1.6; } }
@keyframes fade { to { opacity: 0; } }
@keyframes shake { 20%, 60% { margin-left: -6px; } 40%, 80% { margin-left: 6px; } }
.floater { position: absolute; transform: translateX(-50%); font-weight: 800; pointer-events: none; animation: rise .9s forwards; white-space: nowrap; }
.floater.good { color: var(--good); }
.floater.bad { color: var(--bad); }
.floater.level { color: var(--warn); font-size: 1.6rem; }
@keyframes rise { from { opacity: 1; } to { opacity: 0; margin-top: -50px; } }
.overlay { position: absolute; inset: 0; background: rgba(5, 9, 18, .75); display: grid; place-items: center; z-index: 5; }
.overlay .card { width: min(320px, 90%); }

/* send mode (straight keyer) */
.screen-send-play { padding: 12px 14px; display: flex; flex-direction: column; }
.send-stage { justify-content: space-between; align-items: stretch; gap: 10px; }
.slot.ok { border-color: var(--good); color: var(--good); }
.slot.bad { border-color: var(--bad); color: var(--bad); }
.send-prompt { text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.send-ch { font-size: 3.8rem; font-weight: 800; line-height: 1.05; color: var(--accent); }
.send-hint { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 6px; }
.send-live { min-height: 40px; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px;
  padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.send-pat i { height: 10px; }
.send-pat .dot { width: 10px; }
.send-pat .dash { width: 28px; }
.send-decoded { font-weight: 750; font-size: 1.2rem; color: var(--muted); }
.send-decoded.good { color: var(--good); }
.send-decoded.bad { color: var(--bad); }
.send-meter { display: flex; flex-direction: column; gap: 4px; }
.hold-bar { position: relative; height: 12px; background: var(--panel2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.hold-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 99px; }
.hold-fill.dah { background: var(--good); }
.hold-split { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--warn); }
.keyer-pad { flex: 1; min-height: 130px; max-height: 200px; border-radius: 20px; border: 2px solid var(--accent);
  background: radial-gradient(circle at 50% 30%, #1e3154 0%, var(--panel) 80%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  user-select: none; touch-action: none; box-shadow: 0 6px 24px rgba(56, 189, 248, .18); transition: transform .05s, background .1s; }
.keyer-pad.active, .keyer-pad:active { transform: scale(.98); background: var(--accent); color: var(--accent-ink); box-shadow: 0 0 28px rgba(56, 189, 248, .55); }
.keyer-pad.active small, .keyer-pad:active small { color: var(--accent-ink); }
.keyer-ic { font-size: 2rem; }
.keyer-pad b { font-size: 1.35rem; letter-spacing: .05em; }

  /**
   * Set 2 Curriculum: On-Air CW (Q-Codes, Abbreviations & Callsigns), 15 lessons.

  MT.QSO_LESSONS = [
    {
      id: 1, part: 'A', title: 'Station Basics & Greetings',
      subtitle: 'How every Morse contact starts, turns over, and signs off.',
      items: [

        { code: 'DE',  meaning: 'From / this is',      usage: 'Placed between the called station and your own callsign.', example: 'W1AW DE K5TR K' },

    },

      subtitle: 'Giving signal reports and introducing the operator.',
      items: [
        { code: 'RST', meaning: 'Readability, Strength, Tone (e.g. 599)', usage: '3-digit signal quality report: 1–5 readability, 1–9 strength, 1–9 tone.', example: 'UR RST 599 599' },
        { code: 'UR',  meaning: 'Your / you are',      usage: 'Used before RST, signal notes, or operator comments.', example: 'UR SIGS SOLID HR' },
        { code: 'OP',  meaning: 'Operator',            usage: 'Introduces the name of the person at the key.', example: 'OP HR SAM' },
        { code: 'OM',  meaning: 'Old Man (fellow operator)', usage: 'Friendly term of address for a male radio operator (YL for female).', example: 'GM OM TU FER CALL' },

    },

  /** Synthesize a realistic amateur callsign using only characters present in `chars`. */
  MT.pickCallsign = function (chars, style, rnd) {
    rnd = rnd || Math.random;
    const letters = chars.filter((c) => /[A-Z]/.test(c));
    const digits = chars.filter((c) => /[0-9]/.test(c));
    const hasSlash = chars.indexOf('/') >= 0;
    const pick1 = (arr) => arr[Math.floor(rnd() * arr.length)] || 'K';
    const usPrefixes = ['K', 'W', 'N', 'A'].filter((c) => letters.indexOf(c) >= 0);
    const p1 = usPrefixes.length ? pick1(usPrefixes) : pick1(letters);
    const d1 = digits.length ? pick1(digits) : '0';

    if (style === 'dx') {
      const p2 = pick1(letters);
      const sLen = rnd() < 0.5 ? 2 : 3;
      let suf = '';
      for (let i = 0; i < sLen; i++) suf += pick1(letters);
      return p1 + p2 + d1 + suf;
    }
    const sLen = rnd() < 0.45 ? 2 : 3;
    let base = p1 + d1;
    for (let i = 0; i < sLen; i++) base += pick1(letters);
    if (style === 'portable' && hasSlash) {
      const mods = ['P', 'M', 'QRP', d1].filter((m) => m.split('').every((c) => chars.indexOf(c) >= 0));
      return base + '/' + (mods.length ? pick1(mods) : p1);
    }
    return base;
  };

  /**
   * Pick a word or callsign built strictly from `chars` (unlocked characters).
   * mode: 'words' | 'callsigns'
   */
  MT.pickWordOrCallsign = function (chars, mode, weightFn) {
    const allowed = {};
    chars.forEach((c) => { allowed[c] = true; });
    const validWords = MT.WORDS.filter((w) => {
      for (let i = 0; i < w.length; i++) if (!allowed[w[i]]) return false;
      return true;
    });
    if (mode === 'callsigns' && (Math.random() < 0.4 || !validWords.length)) {
      return MT.pickCallsign(chars, chars.indexOf('/') >= 0 && Math.random() < 0.3 ? 'portable' : 'us');
    }
    if (!validWords.length) {
      return MT.pickCallsign(chars, 'us');
    }
    const weights = validWords.map((w) => {
      if (!weightFn) return 1;
      let sum = 0;
      for (let i = 0; i < w.length; i++) sum += weightFn(w[i]);
      return sum / w.length;
    });
    return MT.pickWeighted(validWords, weights);
  };

  /** All dictionary words that can be spelled using only characters in `chars`. */
  MT.wordsForChars = function (chars) {
    const allowed = {};
    chars.forEach((c) => { allowed[c] = true; });
    return MT.WORDS.filter((w) => {
      for (let i = 0; i < w.length; i++) if (!allowed[w[i]]) return false;
      return true;
    });
  };

  /** Generate a deterministic sample of realistic callsigns formed with `chars`. */
  MT.sampleCallsigns = function (chars, count) {
    count = count || 6;
    const list = [];
    const rnds = [0.12, 0.45, 0.78, 0.23, 0.89, 0.61, 0.34, 0.95];
    for (let i = 0; i < count; i++) {
      let rIdx = 0;
      const rnd = () => {
        const val = rnds[(i + rIdx) % rnds.length];
        rIdx++;
        return val;
      };
      const style = i % 3 === 0 ? 'us' : (i % 3 === 1 ? 'dx' : (chars.indexOf('/') >= 0 ? 'portable' : 'us'));
      const cs = MT.pickCallsign(chars, style, rnd);
      if (list.indexOf(cs) < 0) list.push(cs);
    }
    return list;
  };

  /** ".-" -> "di-dah" style spoken form. */
  MT.say = function (pattern) {
    return pattern.split('').map((e, i, a) =>
      e === '-' ? 'dah' : (i === a.length - 1 ? 'dit' : 'di')).join(' ');
  };

  /**
   * Farnsworth timing. Characters are sent at charWpm; the gaps between
   * characters / words are stretched so the overall speed is effWpm.
   */
  MT.timing = function (charWpm, effWpm) {
    const c = charWpm;
    const s = Math.min(effWpm, charWpm);

      const btns = [];
      const row = h('div', { class: 'seg three' }, options.map((opt) => {
        const disabled = !unlocked && opt.id !== 'random';
        const b = h('button', {
          class: 'seg-btn' + (cur === opt.id ? ' active' : ''),
          disabled: disabled ? 'disabled' : null,
          'data-practice-type': opt.id,
          onclick: () => {

    },

    /** Weakest unlocked characters. */
    weakList(limit) {
      const S = MT.Store;
      const unlocked = MT.KOCH.slice(0, S.data.koch.level);
      const rows = unlocked
        .filter((c) => S.acc(c) != null)
        .sort((a, b) => S.acc(a) - S.acc(b))
        .slice(0, limit || 6);
      if (!rows.length) return h('p', { class: 'muted' }, 'Practise a bit and your weak spots will show up here.');
      return h('div', { class: 'weak' }, rows.map((c) => {
        const a = S.acc(c);
        const cls = a >= 0.9 ? 'good' : a >= 0.7 ? 'ok' : 'bad';
        return h('button', { class: 'weak-row', onclick: () => MT.Audio.play(c, { lead: 0.05 }), title: 'Tap to hear' },
          h('span', { class: 'weak-ch' }, c), UI.pattern(c),
          h('span', { class: 'weak-bar' }, UI.bar(a, cls)),
          h('span', { class: 'weak-pct' }, Math.round(a * 100) + '%'));
      }));
    },

    /** Little tappable chip that plays its character. */
    charChip(c, cls) {
      return h('button', { class: 'chip ' + (cls || ''), onclick: () => MT.Audio.play(c, { lead: 0.05 }) }, c);
    },

    /** Order characters according to keyOrder setting ('koch' = order learned, 'alpha' = A-Z). */
    orderChars(chars) {
      return MT.Store.settings.keyOrder === 'alpha' ? MT.sortChars(chars) : chars.slice();
    },

    /** Resolve effective input mode: 'cards' (#3), 'keys' (#1), 'ditdah' (#2), or 'tree' (#4). */
    effectiveInputMode(chars, override) {
      const m = override || MT.Store.settings.inputMode || 'auto';
      if (m === 'auto') return chars.length <= 5 ? 'cards' : 'keys';
      if (m === 'koch') return 'keys';
      return m;
    },

    /**
     * Build the mobile/on-screen input pad for Koch, Daily, and Arcade.
     * opts: { chars, onChar(c), onBackspace?(), mode? }
     */
    buildInputPad(opts) {
      const chars = opts.chars || [];
      const newest = chars.length >= 2 ? chars[chars.length - 1] : null;
      const ordered = UI.orderChars(chars);
      const eff = UI.effectiveInputMode(chars, opts.mode);
      const wrap = h('div', { class: 'kb-wrap', 'data-input-mode': eff });
      let autoTimer = null;

      const emit = (c) => {
        MT.Audio.tapHaptic(10);
        opts.onChar(c);

      if (eff === 'cards') {

        ordered.forEach((c, i) => {

      } else if (eff === 'ditdah') {

        const patSpan = h('span', { class: 'pattern' });
        const decSpan = h('span', { class: 'send-decoded' });
        const pickBtn = h('button', { class: 'key', onclick: commitNow }, '✓ Pick');
        const backBtn = h('button', {

            if (pat) { pat = pat.slice(0, -1); refreshDd(); }

          },

        }, '⌫');

        function refreshDd() {
          patSpan.innerHTML = '';
          if (!pat) {
            patSpan.append(h('span', { class: 'muted small' }, 'Tap · or − below'));
          } else {
            pat.split('').forEach((e) => patSpan.append(h('i', { class: e === '.' ? 'dot' : 'dash' })));
          }
          const dec = pat ? (MT.DECODE[pat] || '?') : '';
          decSpan.textContent = dec ? '→ ' + dec : '';
          decSpan.className = 'send-decoded' + (dec && dec !== '?' ? ' good' : dec === '?' ? ' bad' : '');
          pickBtn.textContent = dec && dec !== '?' ? '✓ Pick ' + dec : '✓ Pick';
          pickBtn.disabled = !dec || dec === '?';
          pickBtn.classList.toggle('pick-ready', !!(dec && dec !== '?'));
        }

        function commitNow() {
          clearTimeout(autoTimer);
          const dec = MT.DECODE[pat];
          pat = '';
          refreshDd();
          if (dec) emit(dec);
        }

        function tapSym(sym) {
          MT.Audio.tapHaptic(sym === '.' ? 10 : 22);
          clearTimeout(autoTimer);
          if (pat.length < 6) pat += sym;
          refreshDd();
          const dec = MT.DECODE[pat];
          if (dec) {
            const hasLonger = chars.some((c) => MT.CODE[c] && MT.CODE[c].length > pat.length && MT.CODE[c].indexOf(pat) === 0);
            autoTimer = setTimeout(commitNow, hasLonger ? 750 : 450);
          }
        }

        refreshDd();
        wrap.commitCurrent = commitNow;
        wrap.append(
          h('div', { class: 'kb-ditdah' },
            h('div', { class: 'dd-bar' }, patSpan, decSpan),
            h('div', { class: 'dd-btns' },
              h('button', { class: 'dd-btn', 'data-dd': '.', onclick: () => tapSym('.') }, h('b', {}, '·'), h('small', {}, 'dit')),
              h('button', { class: 'dd-btn', 'data-dd': '-', onclick: () => tapSym('-') }, h('b', {}, '−'), h('small', {}, 'dah'))),
            h('div', { class: 'dd-actions' }, pickBtn, backBtn)));
      } else if (eff === 'tree') {
        // #4: Interactive Morse binary tree picker
        let pat = '';

        const curBox = h('div', { class: 'tree-cur' });
        const rightBox = h('div', { class: 'tree-branch' });
        const pickBtn = h('button', { class: 'key tree-commit', onclick: pickNode }, '✓ Pick');

        function refreshTree() {
          const curCh = pat ? (MT.DECODE[pat] || '?') : '';
          const leftCh = MT.DECODE[pat + '.'] || '–';
          const rightCh = MT.DECODE[pat + '-'] || '–';
          leftBox.className = 'tree-branch' + (chars.indexOf(leftCh) < 0 ? ' dim' : '');
          rightBox.className = 'tree-branch' + (chars.indexOf(rightCh) < 0 ? ' dim' : '');
          leftBox.innerHTML = '';
          leftBox.append(h('small', {}, '↙ · dit'), h('b', {}, leftCh));
          rightBox.innerHTML = '';
          rightBox.append(h('small', {}, '− dah ↘'), h('b', {}, rightCh));
          curBox.innerHTML = '';
          curBox.append(
            h('b', {}, curCh || 'Start'),
            h('small', { class: 'muted' }, pat ? pat.replace(/\./g, '·').replace(/-/g, '−') : 'tap · or −'));
          const valid = !!(curCh && curCh !== '?');
          pickBtn.textContent = valid ? '✓ Pick ' + curCh : '✓ Pick';
          pickBtn.disabled = !valid;
          pickBtn.classList.toggle('pick-ready', valid);
        }

        function stepTree(sym) {
          MT.Audio.tapHaptic(10);
          if (pat.length < 6) pat += sym;
          refreshTree();
        }

        function pickNode() {
          const curCh = MT.DECODE[pat];
          pat = '';
          refreshTree();
          if (curCh) emit(curCh);
        }

        refreshTree();
        wrap.append(
          h('div', { class: 'kb-tree' },
            h('div', { class: 'tree-view' }, leftBox, curBox, rightBox),
            h('div', { class: 'tree-btns' },
              h('button', { class: 'key', 'data-tree': '.', onclick: () => stepTree('.') }, '↙ · dit'),
              pickBtn,
              h('button', { class: 'key', 'data-tree': '-', onclick: () => stepTree('-') }, '− dah ↘')),
            h('div', { class: 'dd-actions' },
              h('button', { class: 'key', onclick: () => { pat = pat.slice(0, -1); refreshTree(); } }, '↺ Step back'),
              opts.onBackspace
                ? h('button', { class: 'key', onclick: back, 'aria-label': 'Backspace' }, '⌫ Delete slot')
                : h('button', { class: 'key', onclick: () => { pat = ''; refreshTree(); } }, '↺ Reset'))));
      } else {
        // #1: Key grid (Koch order learned by default, or alphabetical if toggled)
        const grid = h('div', { class: 'kb kb-keys' + (ordered.length <= 12 ? ' compact' : '') });
        ordered.forEach((c) => {
          grid.append(h('button', { class: 'key' + (c === newest ? ' newest' : ''), onclick: () => emit(c) }, c));
        });
        if (opts.onBackspace) {
          grid.append(h('button', { class: 'key wide', onclick: back, 'aria-label': 'Backspace' }, '⌫'));
        }
        wrap.append(grid);
      }

      wrap.cleanup = () => clearTimeout(autoTimer);
      return wrap;
    }
  };

  MT.UI = UI;

/* ==================== app.js ==================== */
/* App shell: screen router, mode registry, bottom navigation, PWA bits. */
(function (g) {
  const MT = (g.MT = g.MT || {});
  const h = MT.h;

  const TABS = [
    { id: 'home', icon: '🏠', label: 'Home' },
    { id: 'chart', icon: '🔤', label: 'Chart' },
    { id: 'stats', icon: '📊', label: 'Stats' },
    { id: 'settings', icon: '⚙️', label: 'Settings' }
  ];

  const App = {
    screens: {},
    modes: [],
    cleanup: null,
    current: null,
    installEvent: null,

    /**
     * Register a screen. fn(root, params) may return a cleanup function,
     * or {redirect:[name, params]} to immediately go elsewhere.
     * opts.nav=false hides the bottom nav (full-screen screens).
     */
    registerScreen(name, fn, opts) {
      opts = opts || {};
      this.screens[name] = { fn: fn, nav: opts.nav !== false, tab: opts.tab };
    },

    /**
     * Register a game mode shown as a card on the home screen.
     * {id, icon, title, tagline() -> string, screen: name, soon?: true}
     * New modes (arcade, send...) only need to call this + registerScreen.
     */
    registerMode(mode) { this.modes.push(mode); },

    go(name, params) {
      const s = this.screens[name];
      if (!s) throw new Error('Unknown screen: ' + name);
      if (this.cleanup) {
        try { this.cleanup(); } catch (e) { console.error(e); }
        this.cleanup = null;
      }
      MT.Audio.stop();
      this.current = name;
      const root = document.getElementById('screen');
      root.innerHTML = '';
      root.scrollTop = 0;
      root.className = 'screen screen-' + name;
      document.body.classList.toggle('no-nav', !s.nav);
      const r = s.fn(root, params || {});
      if (r && r.redirect) return this.go(r.redirect[0], r.redirect[1]);
      if (typeof r === 'function') this.cleanup = r;
      this.markTab(s.tab || name);
    },

    markTab(id) {
      document.querySelectorAll('#nav button').forEach((b) =>
        b.classList.toggle('active', b.dataset.tab === id));
    },

    buildNav() {
      const nav = document.getElementById('nav');
      nav.innerHTML = '';
      TABS.forEach((t) => nav.append(h('button', { 'data-tab': t.id, onclick: () => App.go(t.id) },
        h('span', { class: 'nav-ic' }, t.icon), h('span', {}, t.label))));
    },

    setupPwa() {
      try {
        const makePng = (sz) => {
          const c = document.createElement('canvas');
          c.width = c.height = sz;
          const g = c.getContext('2d');
          if (!g) return '';
          const s = sz / 512;
          g.fillStyle = '#0b1220';
          g.fillRect(0, 0, sz, sz);
          g.fillStyle = '#131c2f';
          g.fillRect(40 * s, 40 * s, 432 * s, 432 * s);
          g.fillStyle = '#38bdf8';
          const pill = (x, y, w, h) => {
            const r = h / 2;
            g.beginPath();
            g.arc(x + r, y + r, r, Math.PI * 0.5, Math.PI * 1.5);
            g.arc(x + w - r, y + r, r, Math.PI * 1.5, Math.PI * 0.5);
            g.closePath();
            g.fill();
          };
          pill(86 * s, 226 * s, 130 * s, 60 * s);
          pill(240 * s, 226 * s, 130 * s, 60 * s);
          g.beginPath();
          g.arc(416 * s, 256 * s, 30 * s, 0, Math.PI * 2);
          g.fill();
          return c.toDataURL('image/png');
        };
        const ic192 = makePng(192);
        const ic512 = makePng(512);
        if (ic192) {
          let touch = document.querySelector('link[rel="apple-touch-icon"]');
          if (!touch) {
            touch = h('link', { rel: 'apple-touch-icon' });
            document.head.append(touch);
          }
          touch.href = ic192;
        }
        if (/^https?:$/.test(location.protocol) && ic192 && ic512) {
          const base = location.href.split('#')[0].split('?')[0];
          const scope = base.slice(0, base.lastIndexOf('/') + 1);
          const manifest = {
            name: 'Morse Trainer',
            short_name: 'Morse',
            description: 'Learn Morse code by ear with the Koch method. Works offline.',
            start_url: base,
            scope: scope,
            display: 'standalone',
            orientation: 'portrait',
            background_color: '#0b1220',
            theme_color: '#0b1220',
            icons: [
              { src: ic192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
              { src: ic512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
            ]
          };
          let mLink = document.querySelector('link[rel="manifest"]');
          if (!mLink) {
            mLink = h('link', { rel: 'manifest' });
            document.head.append(mLink);
          }
          mLink.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
        }
      } catch (e) { /* ignore canvas/manifest errors */ }
    },

    start() {
      this.setupPwa();
      this.buildNav();
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        App.installEvent = e;
        if (App.current === 'home') App.go('home');
      });
      window.addEventListener('appinstalled', () => { App.installEvent = null; });
      if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
      this.go('home');
    }
  };

  MT.App = App;
})(globalThis);

/* ==================== trainer.js ==================== */
/* Shared "listen and type" engine used by Koch (A), Set 2 Copy (B), and Daily (E). */
(function (g) {
  const MT = (g.MT = g.MT || {});
  const h = MT.h;

  /**
   * cfg: {
   *   title, intro?, chars: [allowed on-screen keys], groupSize?,
   *   groups?: number            // end after N groups, or
   *   timeLimitSec?: number      // end after the group in which time runs out
   *   pickGroup(size) -> string,
   *   onFinish(result, completed), onQuit()
   * }
   * result: {chars:{c:{seen,correct}}, confusions, groups, activeSec, correct, total, accuracy}
   */
  function mount(root, cfg) {
    const size = cfg.groupSize || MT.Store.settings.groupSize;
    let state = 'ready';            // ready | answering | feedback | done
    let expected = '', typed = '';
    let activeSec = 0, groupsDone = 0, correct = 0, total = 0;
    let handle = null, finished = false, lastCols = [];
    let slotsBox = null, listenBox = null;
    const stats = {}, confusions = {};

    const btn = (label, cls, fn) => h('button', { class: 'btn ' + cls, onclick: fn }, label);
    const meter = h('div', { class: 'p-meter' });
    const barFill = h('div', { class: 'bar-fill' });
    const stage = h('div', { class: 'p-stage' });
    const actions = h('div', { class: 'p-actions' });
    const kb = MT.UI.buildInputPad({ chars: cfg.chars, onChar: typeChar, onBackspace: backspace });
    kb.classList.add('hidden');
    const box = h('div', { class: 'practice' },
      h('div', { class: 'p-top' },
        btn('✕ Quit', 'ghost small', () => finish(false)),
        h('div', { class: 'p-title' }, cfg.title), meter),
      h('div', { class: 'bar' }, barFill), stage, actions, kb);
    // Keep focus away from buttons so Enter/Space never double-fire.
    box.addEventListener('mousedown', (e) => { if (e.target.closest('button')) e.preventDefault(); });
    root.append(box);

    const isLast = () =>
      (cfg.groups && groupsDone >= cfg.groups) || (cfg.timeLimitSec && activeSec >= cfg.timeLimitSec);

    function updateMeter() {
      if (cfg.groups) {
        const n = Math.min(cfg.groups, state === 'feedback' ? groupsDone : groupsDone + 1);
        meter.textContent = 'Group ' + n + '/' + cfg.groups;
        barFill.style.width = Math.round(100 * groupsDone / cfg.groups) + '%';
      } else {
        meter.textContent = MT.UI.fmtTime(Math.max(0, cfg.timeLimitSec - activeSec)) + ' left';
        barFill.style.width = Math.min(100, Math.round(100 * activeSec / cfg.timeLimitSec)) + '%';
      }
    }

    function setPlaying(on) { if (listenBox) listenBox.classList.toggle('playing', on); }

    function playExpected(lead) {
      if (handle) handle.stop();
      setPlaying(true);
      const hd = (handle = MT.Audio.play(expected, { lead: lead }));
      hd.done.then(() => { if (handle === hd) setPlaying(false); });
    }

    function updateSlots() {
      if (!slotsBox) return;
      slotsBox.innerHTML = '';
      const curLen = expected ? expected.length : size;
      for (let i = 0; i < curLen; i++) {
        slotsBox.append(h('div', { class: 'slot' + (i === typed.length ? ' active' : '') + (typed[i] ? ' filled' : '') }, typed[i] || ''));
      }
    }

    function render() {
      stage.innerHTML = '';
      actions.innerHTML = '';
      slotsBox = null; listenBox = null;
      kb.classList.toggle('hidden', state !== 'answering');

      if (state === 'ready') {
        stage.append(h('div', { class: 'ready' },
          h('div', { class: 'big-icon' }, '📡'),
          h('p', {}, cfg.intro || 'Listen to ' + size + ' characters, then type what you heard.'),
          h('div', { class: 'chips' }, MT.UI.orderChars(cfg.chars).map((c) => MT.UI.charChip(c))),
          h('p', { class: 'muted small' }, 'Tip: you can tap the characters above to hear them. Physical keyboard works too (Space = replay, Enter = submit).')));
        actions.append(btn('▶ Start', 'primary', start));
      } else if (state === 'answering') {
        listenBox = h('div', { class: 'listen' }, [0, 1, 2, 3, 4, 5, 6].map((i) => h('i', { style: '--i:' + i })));
        slotsBox = h('div', { class: 'slots' });
        stage.append(listenBox, h('p', { class: 'muted center' }, 'What did you hear?'), slotsBox);
        updateSlots();
        actions.append(btn('🔊 Replay', '', () => playExpected(0.05)), btn('Submit ✓', 'primary', submit));
      } else if (state === 'feedback') {
        const ok = lastCols.filter((c) => c.ok).length;
        const wrong = [];
        lastCols.forEach((c) => { if (c.exp && !c.ok && wrong.indexOf(c.exp) < 0) wrong.push(c.exp); });
        stage.append(
          h('div', { class: 'fb-score ' + (ok === expected.length ? 'good' : '') },
            ok === expected.length ? '✓ Perfect!' : ok + ' / ' + expected.length + ' correct'),
          h('div', { class: 'fb-grid' }, lastCols.map((c) =>
            h('div', { class: 'fb-col ' + (c.ok ? 'ok' : 'bad') },
              h('div', { class: 'fb-exp' }, c.exp || '+'),
              h('div', { class: 'fb-got' }, c.ok ? '✓' : (c.got || '–'))))),
          wrong.length ? h('div', { class: 'fb-missed' },
            h('p', { class: 'muted small' }, 'Missed — tap to hear:'),
            wrong.map((c) => h('button', { class: 'missed', onclick: () => MT.Audio.play(c, { lead: 0.05 }) },
              h('b', {}, c), MT.UI.pattern(c)))) : []);
        actions.append(btn('🔊 Hear again', '', () => playExpected(0.05)),
          btn(isLast() ? 'Finish ▶' : 'Next ▶', 'primary', next));
      }
      updateMeter();
    }

    function start() {
      MT.Audio.ensure();
      nextGroup();
    }

    function nextGroup() {
      expected = cfg.pickGroup(size);
      typed = '';
      state = 'answering';
      render();
      playExpected(0.45);
    }

    function typeChar(c) {
      const curLen = expected ? expected.length : size;
      if (state !== 'answering' || typed.length >= curLen) return;
      typed += c;
      updateSlots();
    }
    function backspace() {
      if (state !== 'answering') return;
      typed = typed.slice(0, -1);
      updateSlots();

    function submit() {
      if (state !== 'answering') return;
      if (handle) handle.stop();
      const cols = MT.align(expected, typed);
      cols.forEach((c) => {
        if (c.exp == null) return;
        const s = stats[c.exp] || (stats[c.exp] = { seen: 0, correct: 0 });
        s.seen++; total++;
        if (c.ok) { s.correct++; correct++; }
        else if (c.got != null) {
          const k = c.exp + '>' + c.got;
          confusions[k] = (confusions[k] || 0) + 1;
        }

    function next() {

    function replay() { if (state === 'answering' || state === 'feedback') playExpected(0.05); }

        chars: stats, confusions: confusions, groups: groupsDone, activeSec: activeSec,
        correct: correct, total: total, accuracy: total ? correct / total : 0

      } else if (state === 'feedback') {
        if (k === 'Enter') { e.preventDefault(); next(); }

      }
    }

    const ticker = setInterval(() => {
      if ((state === 'answering' || state === 'feedback') && document.visibilityState === 'visible') {

      }

    function cleanup() {
      clearInterval(ticker);

      clearTimeout(commitTimer);
      cancelAnimationFrame(meterRaf);

      document.removeEventListener('keyup', onKeyUp);

      if (MT.Send.debug && MT.Send.debug.owner === commitChar) MT.Send.debug = null;

      owner: commitChar,
      tap(durMs) { keyDown(0); keyUp(durMs); },

      commit: commitChar,
      nextGroup: nextGroup,
      get state() {

          state: state, targetGroup: targetGroup, idx: idx, curPat: curPat,

/* ==================== qso.js ==================== */
/* Set 2: On-Air CW (Q-Codes, Abbreviations & Callsigns) — 15 lessons across Part A (Study) & Part B (Copy). */
(function (g) {
  const MT = (g.MT = g.MT || {});
  const h = MT.h, UI = MT.UI, App = MT.App, S = MT.Store;
  const LESSONS = MT.QSO_LESSONS;
  const TOTAL = LESSONS.length;

  function qsoData() {
    return S.data.qso || (S.data.qso = { level: 1, highestPassed: 0, last: null });
  }

  function unlockedKoch() {
    return MT.KOCH.slice(0, S.data.koch.level);
  }

  function allPartAItems() {
    const out = [];
    LESSONS.forEach((l) => { if (l.items) l.items.forEach((it) => out.push(it)); });
    return out;
  }

  const CONTEST_POOL = ['599', '579', 'TU', 'QSL', '73', 'QRZ', 'DE', 'K'];
  const FULL_POOL = ['CQ', 'DE', 'K', 'TU', '73', 'RST', '599', '579', 'QTH', 'QSL', 'QRM', 'QRN', 'QSB', 'QSY', 'QRS', 'QRP', 'QRZ', 'QRT', 'PSE', 'FB', 'SK', 'WX', 'ANT', 'PWR'];

  function poolForLesson(lesson) {
    if (lesson.pool) return lesson.pool;
    if (lesson.callsignStyle === 'contest') return CONTEST_POOL;
    if (lesson.callsignStyle === 'full') return FULL_POOL;
    return [];
  }

  /** Characters needed on the keypad for a Part B lesson. */
  function charsForLesson(lesson) {
    const base = unlockedKoch().slice();
    const pool = poolForLesson(lesson);
    pool.forEach((tok) => {
      for (let i = 0; i < tok.length; i++) {
        const c = tok[i];
        if (MT.CODE[c] && base.indexOf(c) < 0) base.push(c);
      }
    });
    if (lesson.callsignStyle === 'portable' && base.indexOf('/') < 0) base.push('/');
    return base;
  }

  /** Pick a Q-code, abbreviation, or synthesized callsign for Part B ear-copy practice. */
  function pickPartBGroup(lesson) {
    const kChars = unlockedKoch();
    if (lesson.pool) {
      const weights = lesson.pool.map((tok) => {
        let sum = 0;
        for (let i = 0; i < tok.length; i++) {
          const a = S.acc(tok[i]);
          sum += 1 + (a == null ? 1.5 : (1 - a) * 2.5);
        }
        return sum / tok.length;
      });
      return MT.pickWeighted(lesson.pool, weights);
    }
    const style = lesson.callsignStyle || 'us';
    if (style === 'us' || style === 'dx' || style === 'portable') {
      const csChars = style === 'portable' && kChars.indexOf('/') < 0 ? kChars.concat(['/']) : kChars;
      return MT.pickCallsign(csChars, style);
    }
    if (style === 'contest') {
      if (Math.random() < 0.55) return MT.pickCallsign(kChars, Math.random() < 0.4 ? 'dx' : 'us');
      return CONTEST_POOL[Math.floor(Math.random() * CONTEST_POOL.length)];
    }
    // style === 'full'
    if (Math.random() < 0.45) {
      const st = Math.random() < 0.25 ? 'portable' : (Math.random() < 0.5 ? 'dx' : 'us');
      const csChars = st === 'portable' && kChars.indexOf('/') < 0 ? kChars.concat(['/']) : kChars;
      return MT.pickCallsign(csChars, st);
    }
    return FULL_POOL[Math.floor(Math.random() * FULL_POOL.length)];
  }

  function finishQsoLesson(lesson, result, completed, retryFn) {
    const rec = S.recordResult(result, { srs: false });
    const q = qsoData();
    const pass = completed && result.accuracy * 100 >= S.settings.threshold;
    const prevDone = S.qsoLessonsCompleted();
    q.last = { level: lesson.id, acc: result.accuracy };
    let message = completed ? null : 'Lesson ended early — time & progress saved, but no unlock this time.';
    if (pass) {
      q.highestPassed = Math.max(q.highestPassed || 0, lesson.id);
      if (q.level === lesson.id && q.level < TOTAL) q.level++;
      if (lesson.id === 6 && !S.qsoPartBUnlocked()) {
        message = '🎉 Part A complete! Reach Set 1, Lesson 30 to unlock Part B live ear-copy lessons.';
      } else if (lesson.id < TOTAL) {
        message = '🎉 Passed Set 2, Lesson ' + lesson.id + '! Next up: ' + LESSONS[lesson.id].title + '.';
      } else {
        message = '🏆 You have completed all 15 On-Air CW lessons!';
      }
    } else if (completed) {
      message = 'Reach ' + S.settings.threshold + '% accuracy to unlock the next Set 2 lesson.';
    }
    const badge = pass && lesson.id > prevDone ? S.qsoBadgeForLesson(lesson.id) : null;
    if (badge) message += '  ' + badge.icon + ' Badge unlocked: ' + badge.title + ' (Set 2 Lesson ' + badge.lesson + ')!';
    if (rec.newlyDone) message += '  🔥 Daily goal reached — streak: ' + rec.streak + '!';

        { label: pass && lesson.id < TOTAL ? 'Next lesson ›' : 'Try again', primary: true, fn: () => (pass && lesson.id < TOTAL ? App.go('qso') : retryFn()) },

      chars: chars,
      groups: S.settings.groupsPerRound,
      pickGroup: () => pickPartBGroup(lesson),

      onFinish: (result, completed) => finishQsoLesson(lesson, result, completed, () => startPartBRound(lesson))
    });
  }

  /* ------------------------------------------------ Part A Study & Quiz */
  App.registerScreen('qso-study', (root, p) => {
    const q = qsoData();
    const lesson = (p && p.lesson) || LESSONS[Math.max(0, Math.min(TOTAL - 1, q.level - 1))];
    const items = lesson.items || LESSONS[0].items;
    const allItems = allPartAItems();

    // Build 10 questions: 2 per item (1 code->meaning, 1 meaning->code)
    const questions = [];
    items.forEach((it) => {
      const distractorsM = allItems.filter((x) => x.code !== it.code).sort(() => Math.random() - 0.5).slice(0, 3);
      const optsM = [it].concat(distractorsM).sort(() => Math.random() - 0.5);
      questions.push({
        type: 'code-to-meaning',
        item: it,
        prompt: 'What does “' + it.code + '” mean on the air?',
        options: optsM.map((o) => ({ label: o.meaning, ok: o.code === it.code, code: o.code }))
      });

      const distractorsC = allItems.filter((x) => x.code !== it.code).sort(() => Math.random() - 0.5).slice(0, 3);
      const optsC = [it].concat(distractorsC).sort(() => Math.random() - 0.5);
      questions.push({
        type: 'meaning-to-code',
        item: it,
        prompt: 'Which CW code means: “' + it.meaning + '”?',
        sub: it.usage,
        options: optsC.map((o) => ({ label: o.code, ok: o.code === it.code, code: o.code }))
      });
    });

    let qIdx = 0, correct = 0, total = 0, activeSec = 0, answered = null, finished = false;
    const stats = {}, confusions = {};

    const meter = h('div', { class: 'p-meter' });
    const barFill = h('div', { class: 'bar-fill' });
    const stage = h('div', { class: 'p-stage' });
    const actions = h('div', { class: 'p-actions' });

    const box = h('div', { class: 'practice' },
      h('div', { class: 'p-top' },
        h('button', { class: 'btn ghost small', onclick: () => finish(false) }, '✕ Quit'),
        h('div', { class: 'p-title' }, 'Set 2 · Lesson ' + lesson.id),
        meter),
      h('div', { class: 'bar' }, barFill),
      stage,
      actions);
    root.append(box);

    function recordItemChars(code, ok) {
      for (let i = 0; i < code.length; i++) {
        const c = code[i];
        if (!MT.CODE[c]) continue;
        const s = stats[c] || (stats[c] = { seen: 0, correct: 0 });
        s.seen++;
        if (ok) s.correct++;
      }
    }

    function choose(optIdx) {
      if (answered != null || finished) return;
      const cur = questions[qIdx];
      const opt = cur.options[optIdx];
      if (!opt) return;
      answered = optIdx;
      total++;
      if (opt.ok) correct++;
      recordItemChars(cur.item.code, opt.ok);
      MT.Audio.play(cur.item.code, { lead: 0.05 });
      renderQuestion();
    }

    function nextQ() {
      if (answered == null) return;
      if (qIdx + 1 >= questions.length) {
        finish(true);
      } else {
        qIdx++;
        answered = null;
        renderQuestion();
        const cur = questions[qIdx];
        if (cur.type === 'code-to-meaning') {
          MT.Audio.play(cur.item.code, { lead: 0.08 });
        }
      }
    }

    function renderQuestion() {
      stage.innerHTML = '';
      actions.innerHTML = '';
      const cur = questions[qIdx];
      meter.textContent = (qIdx + 1) + '/' + questions.length;
      barFill.style.width = Math.round(100 * qIdx / questions.length) + '%';

      const codePats = h('div', { class: 'row', style: 'justify-content:center;gap:10px;flex-wrap:wrap' },
        cur.item.code.split('').map((c) => h('span', { class: 'row', style: 'gap:4px' }, h('b', {}, c), UI.pattern(c))));

      stage.append(
        h('div', { class: 'card center', style: 'width:100%' },
          cur.type === 'code-to-meaning'
            ? h('div', {},
                h('div', { class: 'big-num' }, cur.item.code),
                codePats,
                h('p', { class: 'small muted' }, 'Example: ' + cur.item.example))
            : h('div', {},
                h('p', { class: 'small muted' }, cur.sub || ''),
                answered != null ? codePats : null),
          h('p', { style: 'margin-top:8px;font-weight:600' }, cur.prompt)),
        h('div', { class: 'quiz-opts', style: 'width:100%' }, cur.options.map((opt, idx) => {
          let cls = 'quiz-opt';
          if (answered != null) {
            if (opt.ok) cls += ' ok';
            else if (idx === answered) cls += ' bad';
          }
          return h('button', {
            class: cls,
            onclick: () => choose(idx)
          },
            h('span', { class: 'quiz-k' }, String(idx + 1)),
            h('span', { class: 'grow' }, opt.label));
        })));

      if (answered == null) {
        actions.append(
          h('button', { class: 'btn', onclick: () => MT.Audio.play(cur.item.code, { lead: 0.05 }) }, '🔊 Hear code'),
          h('button', { class: 'btn', onclick: () => MT.Audio.play(cur.item.example, { lead: 0.05 }) }, '🔊 Hear example'));
      } else {
        actions.append(
          h('button', { class: 'btn', onclick: () => MT.Audio.play(cur.item.example, { lead: 0.05 }) }, '🔊 Example: ' + cur.item.example),
          h('button', { class: 'btn primary', onclick: nextQ }, qIdx + 1 >= questions.length ? 'Finish ▶' : 'Next ›'));
      }
    }

    function finish(completed) {
      if (finished) return;
      finished = true;
      cleanup();
      if (!total) { App.go('qso'); return; }
      const acc = total ? correct / total : 0;
      const result = {
        chars: stats, confusions: confusions, groups: total,
        activeSec: Math.max(1, activeSec),
        correct: correct, total: total, accuracy: acc
      };
      finishQsoLesson(lesson, result, completed, () => App.go('qso-study', { lesson: lesson }));
    }

    function onKey(e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === 'Escape') { e.preventDefault(); finish(false); return; }
      if (answered == null && /^[1-4]$/.test(e.key)) {
        e.preventDefault();
        choose(Number(e.key) - 1);
      } else if (answered != null && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        nextQ();
      }
    }

    const ticker = setInterval(() => {
      if (document.visibilityState === 'visible') activeSec++;
    }, 1000);
    document.addEventListener('keydown', onKey);

    function cleanup() {
      clearInterval(ticker);
      document.removeEventListener('keydown', onKey);
      MT.Audio.stop();
      if (MT.QSO.debug && MT.QSO.debug.owner === choose) MT.QSO.debug = null;
    }

    renderQuestion();
    MT.Audio.play(questions[0].item.code, { lead: 0.1 });

    MT.QSO.debug = {
      owner: choose,
      choose: choose,
      next: nextQ,
      answerCurrentCorrectly() {
        const cur = questions[qIdx];
        const okIdx = cur.options.findIndex((o) => o.ok);
        choose(okIdx);
      },
      addActiveSec(s) { activeSec += s; },
      get state() {
        return { qIdx: qIdx, totalQuestions: questions.length, correct: correct, total: total, activeSec: activeSec, question: questions[qIdx] };
      }
    };
    return cleanup;
  }, { nav: false });

  /* --------------------------------------------------------- Set 2 Hub */
  App.registerScreen('qso', (root) => {
    const q = qsoData();
    if (!q.level || q.level < 1) q.level = 1;
    if (q.level > TOTAL) q.level = TOTAL;
    const lesson = LESSONS[q.level - 1];
    const partAOk = S.qsoPartAUnlocked();
    const partBOk = S.qsoPartBUnlocked();
    const isPartA = lesson.part === 'A';
    const maxStartable = Math.min(TOTAL, (q.highestPassed || 0) + 1);
    const inSequence = lesson.id <= maxStartable;
    const canStart = (isPartA ? partAOk : partBOk) && inSequence;
    const last = q.last && q.last.level === lesson.id ? q.last : null;

    const move = (d) => {
      const n = Math.max(1, Math.min(TOTAL, q.level + d));
      if (n !== q.level) { q.level = n; S.save(); App.go('qso'); }
    };

    const lockBanner = !partAOk
      ? h('section', { class: 'card lock-banner' },
          h('b', {}, '🔒 Unlocks after Set 1, Lesson 15'),
          h('p', { class: 'small muted' },
            'Complete Lesson 15 in Set 1 (Koch Trainer) so you have 16 core letters under your belt before studying Q-codes and on-air abbreviations. ' +
            'Current Set 1 progress: Lesson ' + S.lessonsCompleted() + ' / 15.'))
      : (!isPartA && !partBOk)
      ? h('section', { class: 'card lock-banner' },
          h('b', {}, '🔒 Part B unlocks after Set 1, Lesson 30 & Part A'),
          h('p', { class: 'small muted' },
            'Part B ear-copy drills use Q, Z, numbers, and stroke (/) callsigns. Complete Set 1, Lesson 30 (' + S.lessonsCompleted() + '/30) ' +
            'and Set 2 Part A Lessons 1–6 (' + Math.min(6, S.qsoLessonsCompleted()) + '/6) to unlock live copy rounds.'))
      : null;

    let contentCard = null;
    if (isPartA) {
      contentCard = h('section', { class: 'card' },
        h('div', { class: 'row between' },
          h('b', {}, 'Codes in this lesson'),
          h('span', { class: 'muted small' }, 'Tap 🔊 to hear in Morse')),
        lesson.items.map((it) =>
          h('div', { class: 'qso-item' },
            h('div', { class: 'qso-head' },
              h('span', { class: 'qso-code' }, it.code),
              h('span', { class: 'row', style: 'gap:6px' }, it.code.split('').map((c) => UI.pattern(c))),
              h('button', { class: 'btn small', onclick: () => { MT.Audio.ensure(); MT.Audio.play(it.code, { lead: 0.05 }); } }, '🔊 Hear')),
            h('div', { class: 'qso-meaning' }, h('b', {}, it.meaning), ' — ', it.usage),
            h('button', {
              class: 'btn ghost small qso-ex',
              onclick: () => { MT.Audio.ensure(); MT.Audio.play(it.example, { lead: 0.05 }); }
            }, '🔊 Example: ' + it.example))));
    } else {
      const sampleTokens = lesson.pool
        ? lesson.pool
        : [
            MT.pickCallsign(unlockedKoch(), lesson.callsignStyle === 'full' ? 'us' : lesson.callsignStyle),
            MT.pickCallsign(unlockedKoch(), lesson.callsignStyle === 'full' ? 'dx' : lesson.callsignStyle),
            MT.pickCallsign(unlockedKoch().concat(['/']), lesson.callsignStyle === 'full' ? 'portable' : lesson.callsignStyle)
          ];
      contentCard = h('section', { class: 'card' },
        h('b', {}, 'On-air copy drill'),
        h('p', { class: 'small muted' }, 'Listen to each full Q-code, signal report, or callsign and copy it by ear. Tap any sample below to preview:'),
        h('div', { class: 'chips' }, sampleTokens.map((tok) =>
          h('button', { class: 'chip on', onclick: () => { MT.Audio.ensure(); MT.Audio.play(tok, { lead: 0.05 }); } },
            h('span', { class: 'chip-ch' }, tok)))));
    }

    root.append(
      h('header', { class: 'top' },
        h('button', { class: 'btn ghost small', onclick: () => App.go('home') }, '‹ Home'),
        h('div', { class: 'grow' }, h('h1', {}, 'Q-Codes & Callsigns'))),
      UI.setSwitcher(2),
      lockBanner,
      h('section', { class: 'card' },
        h('div', { class: 'row between' },
          h('button', { class: 'btn small', onclick: () => move(-1), disabled: q.level <= 1 ? 'disabled' : null, 'aria-label': 'Previous Set 2 lesson' }, '‹'),
          h('div', { class: 'center' },
            h('b', { class: 'big-num' }, 'Lesson ' + lesson.id),
            h('div', { class: 'muted small' }, 'of ' + TOTAL + ' · ' + (isPartA ? 'Part A: Meaning & Context' : 'Part B: Ear-Copy Practice'))),
          h('button', { class: 'btn small', onclick: () => move(1), disabled: q.level >= TOTAL ? 'disabled' : null, 'aria-label': 'Next Set 2 lesson' }, '›')),
        h('b', {}, lesson.title),
        h('p', { class: 'muted small' }, lesson.subtitle)),
      contentCard,
      h('section', { class: 'card' },
        h('div', { class: 'row between' },
          h('b', {}, 'Goal'), h('span', { class: 'muted' }, S.settings.threshold + '% accuracy')),
        UI.bar(last ? last.acc : 0, last && last.acc * 100 >= S.settings.threshold ? 'good' : ''),
        h('p', { class: 'small muted' }, last
          ? 'Last attempt: ' + Math.round(last.acc * 100) + '%'
          : (isPartA ? '10-question audio & meaning check (counts toward your daily streak).' : S.settings.groupsPerRound + ' on-air items copied by ear.')),
        UI.badgeStrip('qso')),
      h('div', { class: 'stack' },
        h('button', {
          class: 'btn primary big',
          disabled: canStart ? null : 'disabled',
          onclick: () => {
            if (!canStart) return;
            MT.Audio.ensure();
            if (isPartA) App.go('qso-study', { lesson: lesson });
            else startPartBRound(lesson);
          }
        }, !inSequence && (isPartA ? partAOk : partBOk)
             ? '🔒 Complete Lesson ' + maxStartable + ' first'
             : (isPartA ? '▶ Start study & meaning quiz' : '▶ Start ear-copy round'))));
  });

  MT.QSO = { pickPartBGroup: pickPartBGroup, charsForLesson: charsForLesson, debug: null };

  App.registerMode({
    id: 'qso', icon: '📻', title: 'Q-Codes & Callsigns', screen: 'qso',
    tagline: () => {
      if (!S.qsoPartAUnlocked()) return 'Set 2 · Unlocks after Set 1, Lesson 15';
      const q = qsoData();
      const l = LESSONS[Math.max(0, Math.min(TOTAL - 1, (q.level || 1) - 1))];
      return 'Set 2 · Lesson ' + l.id + ' (' + l.title + ')';
    }
  });
})(globalThis);

/* ==================== boot ==================== */
if (/^#__script=/.test(location.hash)) {
  const s = document.createElement('script');
  s.src = location.hash.slice(10).split('#')[0];
  document.head.append(s);
} else {
  MT.App.start();
}
  </script>
</body>
